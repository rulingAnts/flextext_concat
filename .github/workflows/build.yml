name: Build portable app

# Runs on every version tag (e.g. v1.2.3) and can be triggered manually.
# Each matrix job builds one platform and uploads its artifact; on tag pushes
# all three are attached to a GitHub Release.
#
# Cost: this repo is PUBLIC and every job uses a STANDARD GitHub-hosted runner,
# so Actions minutes are free and unmetered. Do not switch to larger/GPU
# runners, add a schedule: trigger, or make the repo private without Seth's
# explicit approval and a fresh cost estimate.
#
# ffmpeg is bundled because combined mode can measure and join the recordings
# matched to each text. Everything else in the app is pure XML and runs
# without it, so its absence degrades rather than breaks.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write   # required by softprops/action-gh-release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      # The merge engine has no Qt dependency, so it tests on a bare runner.
      - name: Run engine tests
        run: python -m pytest tests/ -q

  build:
    name: ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 = M1 runner (arm64)
          - { name: "macOS arm64",    os: macos-14       }
          - { name: "Windows x86_64", os: windows-latest }
          - { name: "Linux amd64",    os: ubuntu-22.04   }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller

      # ffmpeg-static ships LGPL static builds for darwin-arm64, linux-x64 and
      # win32-x64. ffprobe is intentionally omitted to keep the download small;
      # pydub falls back gracefully without it.
      - name: Download ffmpeg (npm)
        shell: bash
        run: |
          npm install ffmpeg-static
          node -e "
            var fs=require('fs'),path=require('path');
            var ext=process.platform==='win32'?'.exe':'';
            var ff=require('ffmpeg-static');
            fs.mkdirSync('bin',{recursive:true});
            var dst=path.join('bin','ffmpeg'+ext);
            fs.copyFileSync(ff,dst);
            try{fs.chmodSync(dst,0o755);}catch(e){}
            console.log(ff,'->',dst);
          "

      # ── Linux system libs ──────────────────────────────────────────────────
      # PySide6 needs several X11/GL libraries even on a headless runner.
      # libfuse2 is required to run appimagetool (itself an AppImage).
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 \
            libgbm1 libasound2 libxss1 libxtst6 \
            libfuse2

      # ── Build ──────────────────────────────────────────────────────────────

      # macOS: onedir so the app launches instantly (no extraction on startup).
      # --windowed wraps the output in a proper .app bundle.
      - name: Build — onedir + windowed (macOS)
        if: runner.os == 'macOS'
        run: >
          python -m PyInstaller
          --onedir --windowed --name flextext-concat
          --add-data "bin:bin"
          app.py

      # Windows: onefile is the conventional single-exe distribution format.
      - name: Build — onefile + windowed (Windows)
        if: runner.os == 'Windows'
        run: >
          python -m PyInstaller
          --onefile --windowed --name flextext-concat
          --add-data "bin:bin"
          app.py

      # Linux: onedir gives a directory tree that appimagetool can wrap.
      # QT_QPA_PLATFORM=offscreen prevents Qt from trying to open a display
      # during PyInstaller's import analysis phase.
      - name: Build — onedir (Linux → AppImage)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          python -m PyInstaller
          --onedir --name flextext-concat
          --add-data "bin:bin"
          app.py

      # ── Package ────────────────────────────────────────────────────────────

      - name: Package — macOS → zip
        if: runner.os == 'macOS'
        run: cd dist && zip -r ../flextext-concat-macos-arm64.zip flextext-concat.app

      - name: Package — Windows → rename exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist\flextext-concat.exe flextext-concat-windows-x86_64.exe

      - name: Package — Linux → AppImage
        if: runner.os == 'Linux'
        run: |
          mkdir -p AppDir
          cp -r dist/flextext-concat/* AppDir/

          # AppRun: the entry point the AppImage runtime calls
          cat > AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE="${SELF%/*}"
          exec "${HERE}/flextext-concat" "$@"
          APPRUN
          chmod +x AppDir/AppRun

          cat > AppDir/flextext-concat.desktop << 'DESKTOP'
          [Desktop Entry]
          Name=FLExText Concatenator
          Comment=Combine FLEx interlinear .flextext exports
          Exec=flextext-concat
          Icon=flextext-concat
          Type=Application
          Categories=Office;Education;
          DESKTOP

          # Minimal 256x256 PNG placeholder icon.
          # Replace AppDir/flextext-concat.png with real artwork before shipping.
          python3 -c "
          import struct, zlib
          def chunk(t, d):
              c = t + d
              return struct.pack('>I', len(d)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
          W = H = 256
          raw = b''.join(b'\x00' + b'\x2d\x6a\x4f' * W for _ in range(H))
          png = (b'\x89PNG\r\n\x1a\n'
                 + chunk(b'IHDR', struct.pack('>IIBBBBB', W, H, 8, 2, 0, 0, 0))
                 + chunk(b'IDAT', zlib.compress(raw))
                 + chunk(b'IEND', b''))
          open('AppDir/flextext-concat.png', 'wb').write(png)
          "

          wget -q \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir flextext-concat-linux-amd64.AppImage

      # ── Upload artifacts ───────────────────────────────────────────────────

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: flextext-concat-macos-arm64
          path: flextext-concat-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: flextext-concat-windows-x86_64
          path: flextext-concat-windows-x86_64.exe

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: flextext-concat-linux-amd64
          path: flextext-concat-linux-amd64.AppImage

      # ── GitHub Release (tag pushes only) ───────────────────────────────────
      # All three matrix jobs run this step; each uploads only its own file.
      # fail_on_unmatched_files: false lets the other two paths be absent.
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            flextext-concat-macos-arm64.zip
            flextext-concat-windows-x86_64.exe
            flextext-concat-linux-amd64.AppImage
